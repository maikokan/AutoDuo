name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Dependency sanity
        run: pip check

      - name: Import every module
        # Catches a syntax or import error on a version the author does not
        # run locally, before the test job spends minutes finding it.
        run: |
          python -c "import autoduo, autoduo.client, autoduo.daemon, autoduo.enroll, autoduo.protocol, autoduo.redact, autoduo.vault, autoduo.instances, autoduo.dashboard, autoduo.ui"

      - name: Run tests
        run: pytest tests/ -v

      - name: Run bandit
        run: bandit -r autoduo/ -ll

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck logrotate systemd

      - name: Shellcheck
        # Every shell entry point, including the one-liner installer that
        # the README tells people to curl.
        run: |
          shellcheck \
            install.sh \
            scripts/autoduo \
            scripts/install.sh \
            scripts/uninstall.sh

      - name: Compile-check
        run: |
          python -m compileall autoduo/

      - name: systemd-analyze verify
        run: |
          # The unit names the deployed interpreter. Create that path so
          # verify checks the unit rather than the runner's filesystem.
          sudo mkdir -p /opt/autoduo/.venv/bin
          sudo ln -sf "$(command -v python3)" /opt/autoduo/.venv/bin/python
          systemd-analyze verify \
            systemd/autoduo.service \
            systemd/autoduo@.service

      - name: Logrotate config parses
        run: |
          logrotate -d scripts/logrotate-autoduo
